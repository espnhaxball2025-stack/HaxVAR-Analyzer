<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaxVar - VAR DE HAXBALL</title>
    <link rel="icon" type="image/png" href="https://kappa.lol/JNIL1T">
    <!-- MessagePack parser para leer .hbr / .hbr2 de HaxBall -->
    <script src="https://cdn.jsdelivr.net/npm/@msgpack/msgpack@2.8.0/dist.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #ef4444; border-radius: 4px; }
        
        .tv-scanlines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.3;
        }

        input[type=range] {
            accent-color: #ef4444;
        }

        @keyframes flash {
            0% { background-color: rgba(255, 255, 255, 0.8); }
            100% { background-color: transparent; }
        }
        .flash-animation {
            animation: flash 0.5s ease-out;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-red-700 text-white p-4 shadow-lg border-b-4 border-red-900 flex justify-between items-center z-30">
        <div class="flex items-center gap-3">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            <h1 class="text-3xl font-black italic tracking-tighter">HaxVAR <span class="text-red-300 font-normal text-xl uppercase tracking-widest">ANALYZER + REPLAY</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="hidden md:flex text-xs font-medium text-red-200 bg-red-800/50 px-3 py-1 rounded-lg gap-3">
                <span><kbd class="bg-red-900 px-1 rounded">Espacio</kbd> Play/Pausa</span>
                <span><kbd class="bg-red-900 px-1 rounded">← →</kbd> Ticks/Frames</span>
                <span><kbd class="bg-red-900 px-1 rounded">Ctrl+Z</kbd> Deshacer</span>
            </div>
            <div class="text-sm font-semibold bg-red-900 px-4 py-1 rounded-full animate-pulse shadow-inner" id="matchStatusBadge">
                MODO REPLAY - ESPERANDO ARCHIVO
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row p-4 gap-4 max-w-[1600px] mx-auto w-full relative">
        
        <div class="flex-1 flex flex-col gap-4 relative">
            
            <div class="relative bg-black rounded-xl overflow-hidden shadow-2xl border-2 border-slate-700 aspect-video flex items-center justify-center group" id="videoContainer">
                
                <video id="sourceVideo" class="hidden" playsinline></video>
                <canvas id="varCanvas" class="w-full h-full cursor-crosshair transform-gpu"></canvas>
                
                <div class="tv-scanlines"></div>
                <div id="flashOverlay" class="absolute inset-0 pointer-events-none z-30"></div>

                <div id="uploadOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 z-20">
                    <label for="videoUpload" class="cursor-pointer group flex flex-col items-center p-8 border-4 border-dashed border-slate-500 rounded-2xl hover:border-red-500 transition-colors bg-slate-800 hover:bg-slate-700 w-3/4 max-w-lg text-center">
                        <svg class="w-16 h-16 text-slate-400 group-hover:text-red-400 mb-4 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <span class="text-xl font-bold text-slate-200 group-hover:text-white">Cargar Replay Real (.hbr / .hbr2)</span>
                        <span class="text-sm text-slate-400 mt-2">Subí tu .hbr2 y mirá la consola (F12) para chusmear los datos.</span>
                    </label>
                    <input type="file" id="videoUpload" accept=".hbr, .hbr2, video/mp4, video/webm" class="hidden">
                </div>
                
                <button id="btnFullscreen" class="absolute top-4 right-4 z-40 bg-black/50 hover:bg-black/80 text-white p-2 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity hidden">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                </button>
            </div>

            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    
                    <div class="flex items-center gap-2">
                        <button id="btnPlayPause" class="bg-red-600 hover:bg-red-500 text-white rounded-lg p-3 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                            <svg id="iconPlay" class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                            <svg id="iconPause" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        </button>
                        
                        <div class="flex bg-slate-900 rounded-lg overflow-hidden border border-slate-600">
                            <button id="btnFrameBack" title="Frame Anterior" class="p-2 hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
                            <div class="px-3 py-2 text-xs font-bold text-slate-400 border-x border-slate-600 flex items-center">FRAME A FRAME</div>
                            <button id="btnFrameFwd" title="Frame Siguiente" class="p-2 hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
                        </div>
                    </div>

                    <div class="flex-1 mx-4 flex items-center gap-3">
                        <span id="timeCurrent" class="text-sm font-mono text-slate-400 w-16 text-right">00:00.00</span>
                        <input type="range" id="videoProgress" value="0" min="0" max="100" step="1" class="w-full h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer" disabled>
                        <span id="timeTotal" class="text-sm font-mono text-slate-400 w-16">00:00.00</span>
                    </div>

                </div>
            </div>
        </div>

        <div class="w-full lg:w-80 bg-slate-800 rounded-xl border border-slate-700 shadow-xl flex flex-col overflow-hidden lg:max-h-[85vh]">
            <div class="bg-slate-900 p-4 border-b border-slate-700">
                <h2 class="text-lg font-black uppercase tracking-wide text-slate-200">Herramientas VAR</h2>
            </div>
            
            <div class="p-4 flex flex-col gap-5 overflow-y-auto">
                
                <div>
                    <label class="text-xs text-slate-400 uppercase font-bold mb-2 block">Trazado de Líneas</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button class="tool-btn active flex flex-col items-center p-3 rounded-lg border-2 border-red-500 bg-red-900/20 text-white transition-all shadow-inner" data-tool="line-red">
                            <div class="w-full h-1 bg-red-500 mb-2 rounded"></div>
                            <span class="text-xs font-bold text-center">Línea Gol<br>(Roja)</span>
                        </button>
                        <button class="tool-btn flex flex-col items-center p-3 rounded-lg border-2 border-slate-600 hover:border-blue-500 hover:bg-blue-900/20 text-slate-300 transition-all" data-tool="line-blue">
                            <div class="w-full h-1 bg-blue-500 mb-2 rounded"></div>
                            <span class="text-xs font-bold text-center">Offside<br>(Azul)</span>
                        </button>
                        <button class="tool-btn flex flex-col items-center p-3 rounded-lg border-2 border-slate-600 hover:border-yellow-400 hover:bg-yellow-900/20 text-slate-300 transition-all" data-tool="arrow-yellow">
                            <svg class="w-6 h-6 text-yellow-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            <span class="text-xs font-bold text-center">Flecha<br>Indicador</span>
                        </button>
                        <button class="tool-btn flex flex-col items-center p-3 rounded-lg border-2 border-slate-600 hover:border-green-400 hover:bg-green-900/20 text-slate-300 transition-all" data-tool="free-green">
                            <svg class="w-6 h-6 text-green-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            <span class="text-xs font-bold text-center">Lápiz<br>Libre</span>
                        </button>
                        <button class="tool-btn flex flex-col items-center p-3 rounded-lg border-2 border-slate-600 hover:border-white hover:bg-slate-700 text-slate-300 transition-all" data-tool="pan-white">
                            <svg class="w-6 h-6 text-white mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"></path></svg>
                            <span class="text-xs font-bold text-center">Mover<br>Cámara</span>
                        </button>
                        <button class="tool-btn flex flex-col items-center p-3 rounded-lg border-2 border-slate-600 hover:border-purple-400 hover:bg-purple-900/20 text-slate-300 transition-all" data-tool="select-purple">
                            <svg class="w-6 h-6 text-purple-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>
                            <span class="text-xs font-bold text-center">Dedo<br>(Mover trazo)</span>
                        </button>
                    </div>
                </div>

                <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700">
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-xs text-slate-400 uppercase font-bold">Zoom (Lupa)</label>
                        <button id="btnResetZoom" class="text-[10px] bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-white font-bold transition-colors">RESET</button>
                    </div>
                    <div class="mb-2">
                        <div class="flex justify-between text-xs mb-1">
                            <span>Aumento</span>
                            <span id="lblZoom">1.0x</span>
                        </div>
                        <input type="range" id="toolZoom" value="1" min="1" max="10" step="0.1" class="w-full h-1 bg-slate-600 rounded appearance-none">
                    </div>
                </div>

                <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700">
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-xs text-slate-400 uppercase font-bold">Marcadores</label>
                        <button id="btnAddMarker" class="text-[10px] bg-blue-600 hover:bg-blue-500 px-2 py-1 rounded text-white font-bold transition-colors shadow-lg disabled:opacity-50 disabled:cursor-not-allowed" disabled>+ MARCAR ACÁ</button>
                    </div>
                    <div id="markersList" class="flex flex-col gap-2 max-h-32 overflow-y-auto">
                        <div class="text-xs text-slate-500 text-center italic py-2">Ninguna marca. Dale, buscá la falta.</div>
                    </div>
                </div>

                <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700">
                    <label class="text-xs text-slate-400 uppercase font-bold mb-3 block">Ajustes de Trazo</label>
                    <div class="mb-4">
                        <div class="flex justify-between text-xs mb-1">
                            <span>Grosor de Línea</span>
                            <span id="lblThickness">5px</span>
                        </div>
                        <input type="range" id="toolThickness" value="5" min="1" max="20" class="w-full h-1 bg-slate-600 rounded appearance-none">
                    </div>
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span>Opacidad</span>
                            <span id="lblOpacity">80%</span>
                        </div>
                        <input type="range" id="toolOpacity" value="80" min="10" max="100" class="w-full h-1 bg-slate-600 rounded appearance-none">
                    </div>
                </div>

                <div>
                    <label class="text-xs text-slate-400 uppercase font-bold mb-2 block">Acciones</label>
                    <div class="flex flex-col gap-2">
                        <button id="btnExport" class="w-full bg-blue-600 hover:bg-blue-500 p-3 rounded-lg text-sm font-bold text-white flex items-center justify-center gap-2 transition-colors shadow-lg disabled:opacity-50" disabled>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            Exportar Captura VAR
                        </button>
                        <div class="flex gap-2">
                            <button id="btnUndo" class="flex-1 bg-slate-700 hover:bg-slate-600 p-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                                Deshacer
                            </button>
                            <button id="btnClear" class="flex-1 bg-red-900/50 hover:bg-red-600 border border-red-800 hover:border-red-500 p-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                Limpiar
                            </button>
                        </div>
                    </div>
                </div>
                
            </div>
            
            <div class="mt-auto p-4 bg-slate-900 border-t border-slate-700 text-xs text-slate-500 text-center">
                HaxVAR Replay Engine.<br>Inspirado en MrREPLAY.
            </div>
        </div>

    </main>

    <script>
        const video = document.getElementById('sourceVideo');
        const canvas = document.getElementById('varCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const videoUpload = document.getElementById('videoUpload');
        const uploadOverlay = document.getElementById('uploadOverlay');
        const videoContainer = document.getElementById('videoContainer');
        const flashOverlay = document.getElementById('flashOverlay');
        const matchStatusBadge = document.getElementById('matchStatusBadge');
        
        const btnPlayPause = document.getElementById('btnPlayPause');
        const iconPlay = document.getElementById('iconPlay');
        const iconPause = document.getElementById('iconPause');
        const btnFrameFwd = document.getElementById('btnFrameFwd');
        const btnFrameBack = document.getElementById('btnFrameBack');
        const videoProgress = document.getElementById('videoProgress');
        const timeCurrent = document.getElementById('timeCurrent');
        const timeTotal = document.getElementById('timeTotal');
        const btnFullscreen = document.getElementById('btnFullscreen');
        const btnExport = document.getElementById('btnExport');

        const toolBtns = document.querySelectorAll('.tool-btn');
        const toolThickness = document.getElementById('toolThickness');
        const lblThickness = document.getElementById('lblThickness');
        const toolOpacity = document.getElementById('toolOpacity');
        const lblOpacity = document.getElementById('lblOpacity');
        const btnUndo = document.getElementById('btnUndo');
        const btnClear = document.getElementById('btnClear');
        
        const toolZoom = document.getElementById('toolZoom');
        const lblZoom = document.getElementById('lblZoom');
        const btnResetZoom = document.getElementById('btnResetZoom');

        const btnAddMarker = document.getElementById('btnAddMarker');
        const markersList = document.getElementById('markersList');

        // State
        let currentTool = 'line-red';
        let currentThickness = 5;
        let currentOpacity = 0.8;
        let isLoaded = false;
        let isVideoMode = false;
        
        let replayData = null;
        let currentTick = 0;
        let totalTicks = 5400;
        let isPlaying = false;
        let playInterval = null;
        let tickRate = 60;

        let drawings = []; 
        let isDrawing = false;
        let startPos = {x: 0, y: 0};
        let currentMousePos = {x: 0, y: 0};

        canvas.width = 1200;
        canvas.height = 600;

        toolBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                toolBtns.forEach(b => {
                    b.classList.remove('active', 'border-red-500', 'border-blue-500', 'border-yellow-400', 'border-green-400', 'border-white', 'border-purple-400', 'bg-red-900/20', 'bg-blue-900/20', 'bg-yellow-900/20', 'bg-green-900/20', 'bg-slate-700', 'bg-purple-900/20');
                    b.classList.add('border-slate-600');
                });
                btn.classList.add('active');
                currentTool = btn.getAttribute('data-tool');
                if(currentTool.includes('red')) btn.classList.add('border-red-500', 'bg-red-900/20');
                else if(currentTool.includes('blue')) btn.classList.add('border-blue-500', 'bg-blue-900/20');
                else if(currentTool.includes('yellow')) btn.classList.add('border-yellow-400', 'bg-yellow-900/20');
                else if(currentTool.includes('green')) btn.classList.add('border-green-400', 'bg-green-900/20');
                else if(currentTool.includes('white')) btn.classList.add('border-white', 'bg-slate-700');
                else if(currentTool.includes('purple')) btn.classList.add('border-purple-400', 'bg-purple-900/20');
            });
        });

        videoUpload.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const fileName = file.name.toLowerCase();

            if (fileName.endsWith('.hbr') || fileName.endsWith('.hbr2')) {
                isVideoMode = false;
                matchStatusBadge.textContent = "CARGANDO REPLAY...";
                try {
                    const buffer = await file.arrayBuffer();
                    replayData = msgpack.decode(new Uint8Array(buffer));
                    
                    console.log("=== ANÁLISIS DEL HBR2 ===");
                    console.log("Objeto decodificado:", replayData);
                    
                    // Intentar detectar la cantidad de ticks buscando propiedades comunes
                    totalTicks = replayData.totalticks || replayData.duration || (replayData.recording ? replayData.recording.length : 5400);
                    currentTick = 0;
                    videoProgress.max = totalTicks;
                    videoProgress.value = 0;
                    timeTotal.textContent = formatTicksTime(totalTicks);
                    
                    uploadOverlay.classList.add('hidden');
                    btnFullscreen.classList.remove('hidden');
                    btnPlayPause.disabled = false;
                    btnFrameFwd.disabled = false;
                    btnFrameBack.disabled = false;
                    videoProgress.disabled = false;
                    btnAddMarker.disabled = false;
                    btnExport.disabled = false;
                    isLoaded = true;
                    matchStatusBadge.textContent = "MODO REPLAY ACTIVO (.HBR2)";

                    renderCanvasFrame();
                } catch (err) {
                    console.error(err);
                    alert("Error al parsear el archivo .hbr/.hbr2.");
                    matchStatusBadge.textContent = "ERROR EN REPLAY";
                }
            } else {
                isVideoMode = true;
                matchStatusBadge.textContent = "MODO VIDEO ACTIVO";
                const url = URL.createObjectURL(file);
                video.src = url;
                uploadOverlay.classList.add('hidden');
                btnFullscreen.classList.remove('hidden');
                
                btnPlayPause.disabled = false;
                btnFrameFwd.disabled = false;
                btnFrameBack.disabled = false;
                videoProgress.disabled = false;
                btnAddMarker.disabled = false;
                btnExport.disabled = false;
                isLoaded = true;
            }
        });

        function renderCanvasFrame() {
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (isVideoMode) {
                if (video.readyState >= 2) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                }
            } else {
                drawHaxBallPitch();
                drawReplayObjects(currentTick);
            }

            drawings.forEach(d => renderShape(d, ctx));

            if (isDrawing) {
                renderShape({
                    tool: currentTool,
                    points: [],
                    startX: startPos.x,
                    startY: startPos.y,
                    endX: currentMousePos.x,
                    endY: currentMousePos.y,
                    thickness: currentThickness,
                    opacity: currentOpacity
                }, ctx);
            }
        }

        function drawHaxBallPitch() {
            const w = canvas.width;
            const h = canvas.height;

            ctx.fillStyle = "#719266";
            ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.globalAlpha = 0.7;

            ctx.strokeRect(60, 60, w - 120, h - 120);

            ctx.beginPath();
            ctx.moveTo(w / 2, 60);
            ctx.lineTo(w / 2, h - 60);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(w / 2, h / 2, 90, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(w / 2, h / 2, 6, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();

            ctx.strokeRect(60, h / 2 - 120, 50, 240);
            ctx.strokeRect(w - 110, h / 2 - 120, 50, 240);

            ctx.globalAlpha = 1.0;
        }

        function drawReplayObjects(tick) {
            const w = canvas.width;
            const h = canvas.height;
            const centerX = w / 2;
            const centerY = h / 2;

            // Si el archivo trae estados grabados específicos, los usamos, sino mostramos aviso en pantalla
            let ballX = centerX;
            let ballY = centerY;

            if (replayData && replayData.recording && replayData.recording[tick]) {
                // Acá se procesarían los datos reales del recording si se mapea el motor físico
            } else {
                // Animación indicativa de que el reproductor está corriendo pero falta mapear físicas exactas
                ballX = centerX + Math.sin(tick * 0.05) * 200;
                ballY = centerY + Math.cos(tick * 0.03) * 100;
            }

            drawPlayer(centerX - 250, centerY - 60, "#e74c3c", "Jugador 1");
            drawPlayer(centerX - 150, centerY + 60, "#e74c3c", "Jugador 2");
            drawPlayer(centerX + 250, centerY + 60, "#3498db", "Jugador 3");
            drawPlayer(centerX + 150, centerY - 60, "#3498db", "Jugador 4");

            // Pelota
            ctx.beginPath();
            ctx.arc(ballX, ballY, 12, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Texto informativo en el canvas
            ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
            ctx.font = "bold 14px Inter, sans-serif";
            ctx.textAlign = "left";
            ctx.fillText(`Tick: ${tick} / ${totalTicks}`, 80, 100);
        }

        function drawPlayer(x, y, color, name) {
            ctx.beginPath();
            ctx.arc(x, y, 22, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 12px Inter, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(name, x, y - 28);
        }

        function formatTicksTime(ticks) {
            const seconds = ticks / tickRate;
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function togglePlayPause() {
            if(!isLoaded) return;
            if (isVideoMode) {
                if(video.paused) {
                    video.play();
                    iconPlay.classList.add('hidden');
                    iconPause.classList.remove('hidden');
                } else {
                    video.pause();
                    iconPause.classList.add('hidden');
                    iconPlay.classList.remove('hidden');
                }
            } else {
                isPlaying = !isPlaying;
                if(isPlaying) {
                    iconPlay.classList.add('hidden');
                    iconPause.classList.remove('hidden');
                    playReplay();
                } else {
                    iconPause.classList.add('hidden');
                    iconPlay.classList.remove('hidden');
                    clearInterval(playInterval);
                }
            }
        }

        function playReplay() {
            clearInterval(playInterval);
            playInterval = setInterval(() => {
                if (currentTick < totalTicks) {
                    currentTick++;
                    videoProgress.value = currentTick;
                    timeCurrent.textContent = formatTicksTime(currentTick);
                    renderCanvasFrame();
                } else {
                    isPlaying = false;
                    clearInterval(playInterval);
                    iconPause.classList.add('hidden');
                    iconPlay.classList.remove('hidden');
                }
            }, 1000 / tickRate);
        }

        btnPlayPause.addEventListener('click', togglePlayPause);

        videoProgress.addEventListener('input', (e) => {
            if(!isLoaded) return;
            currentTick = parseFloat(e.target.value);
            timeCurrent.textContent = formatTicksTime(currentTick);
            renderCanvasFrame();
        });

        function renderShape(shape, context) {
            context.save();
            context.globalAlpha = shape.opacity || 1.0;
            context.lineWidth = shape.thickness || 5;
            if(shape.tool.includes('red')) context.strokeStyle = "#ef4444";
            else if(shape.tool.includes('blue')) context.strokeStyle = "#3b82f6";
            else if(shape.tool.includes('yellow')) context.strokeStyle = "#facc15";
            else if(shape.tool.includes('green')) context.strokeStyle = "#22c55e";
            else context.strokeStyle = "#ffffff";

            if(shape.startX !== undefined && shape.endX !== undefined) {
                context.beginPath();
                context.moveTo(shape.startX, shape.startY);
                context.lineTo(shape.endX, shape.endY);
                context.stroke();
            }
            context.restore();
        }

        canvas.addEventListener('mousedown', (e) => {
            if(!isLoaded) return;
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            startPos.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            startPos.y = (e.clientY - rect.top) * (canvas.height / rect.height);
            currentMousePos = {...startPos};
        });

        canvas.addEventListener('mousemove', (e) => {
            if(!isLoaded) return;
            const rect = canvas.getBoundingClientRect();
            currentMousePos.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            currentMousePos.y = (e.clientY - rect.top) * (canvas.height / rect.height);
            if(isDrawing) {
                renderCanvasFrame();
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if(!isLoaded || !isDrawing) return;
            isDrawing = false;
            drawings.push({
                tool: currentTool,
                startX: startPos.x,
                startY: startPos.y,
                endX: currentMousePos.x,
                endY: currentMousePos.y,
                thickness: currentThickness,
                opacity: currentOpacity
            });
            renderCanvasFrame();
        });

        toolThickness.addEventListener('input', (e) => {
            currentThickness = e.target.value;
            lblThickness.textContent = currentThickness + 'px';
        });

        toolOpacity.addEventListener('input', (e) => {
            currentOpacity = e.target.value / 100;
            lblOpacity.textContent = e.target.value + '%';
        });

        btnClear.addEventListener('click', () => {
            drawings = [];
            renderCanvasFrame();
        });

        btnUndo.addEventListener('click', () => {
            drawings.pop();
            renderCanvasFrame();
        });
    </script>
</body>
</html>
