<!DOCTYPE html>
<html lang="es" class="scroll-smooth"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaxVar - VAR DE HAXBALL</title>
    <link rel="icon" type="image/png" href="https://kappa.lol/JNIL1T">
    <!-- Librería MessagePack para decodificar archivos .hbr -->
    <script src="https://cdn.jsdelivr.net/npm/msgpack-lite@0.1.26/dist/msgpack.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #ef4444; border-radius: 4px; }
        .tv-scanlines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.3;
        }
        input[type=range] { accent-color: #ef4444; }
        @keyframes flash {
            0% { background-color: rgba(255, 255, 255, 0.8); }
            100% { background-color: transparent; }
        }
        .flash-animation { animation: flash 0.5s ease-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-red-700 text-white p-4 shadow-lg border-b-4 border-red-900 flex justify-between items-center z-30">
        <div class="flex items-center gap-3">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            <h1 class="text-3xl font-black italic tracking-tighter">HaxVAR <span class="text-red-300 font-normal text-xl uppercase tracking-widest">ANALYZER</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-sm font-semibold bg-red-900 px-4 py-1 rounded-full animate-pulse shadow-inner">
                EN VIVO - CABINA DE REVISIÓN .HBR
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row p-4 gap-4 max-w-[1600px] mx-auto w-full relative">
        <div class="flex-1 flex flex-col gap-4 relative">
            <div class="relative bg-black rounded-xl overflow-hidden shadow-2xl border-2 border-slate-700 aspect-video flex items-center justify-center group" id="videoContainer">
                <video id="sourceVideo" class="hidden" playsinline=""></video>
                <canvas id="varCanvas" class="w-full h-full cursor-crosshair transform-gpu"></canvas>
                <div class="tv-scanlines"></div>
                <div id="flashOverlay" class="absolute inset-0 pointer-events-none z-30"></div>

                <div id="uploadOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/80 z-20">
                    <label for="videoUpload" class="cursor-pointer group flex flex-col items-center p-8 border-4 border-dashed border-slate-500 rounded-2xl hover:border-red-500 transition-colors bg-slate-800 hover:bg-slate-700 w-3/4 max-w-lg text-center">
                        <svg class="w-16 h-16 text-slate-400 group-hover:text-red-400 mb-4 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <span class="text-xl font-bold text-slate-200 group-hover:text-white">Cargar Replay Oficial de HaxBall (.hbr / .hbr2)</span>
                        <span class="text-sm text-slate-400 mt-2">Seleccioná tu archivo .hbr para analizar la jugada.</span>
                    </label>
                    <input type="file" id="videoUpload" accept=".hbr, .hbr2, video/mp4, video/webm" class="hidden">
                </div>
                
                <button id="btnFullscreen" class="absolute top-4 right-4 z-40 bg-black/50 hover:bg-black/80 text-white p-2 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity hidden">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                </button>
            </div>

            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center gap-2">
                        <button id="btnPlayPause" class="bg-red-600 hover:bg-red-500 text-white rounded-lg p-3 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="">
                            <svg id="iconPlay" class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                            <svg id="iconPause" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        </button>
                        
                        <div class="flex bg-slate-900 rounded-lg overflow-hidden border border-slate-600">
                            <button id="btnFrameBack" title="Frame Anterior" class="p-2 hover:bg-slate-700 disabled:opacity-50" disabled=""><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
                            <div class="px-3 py-2 text-xs font-bold text-slate-400 border-x border-slate-600 flex items-center">FRAME A FRAME</div>
                            <button id="btnFrameFwd" title="Frame Siguiente" class="p-2 hover:bg-slate-700 disabled:opacity-50" disabled=""><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
                        </div>
                    </div>

                    <div class="flex-1 mx-4 flex items-center gap-3">
                        <span id="timeCurrent" class="text-sm font-mono text-slate-400 w-16 text-right">00:00.00</span>
                        <input type="range" id="videoProgress" value="0" min="0" max="100" step="1" class="w-full h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer" disabled="">
                        <span id="timeTotal" class="text-sm font-mono text-slate-400 w-16">00:00.00</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full lg:w-80 bg-slate-800 rounded-xl border border-slate-700 shadow-xl flex flex-col overflow-hidden lg:max-h-[85vh]">
            <div class="bg-slate-900 p-4 border-b border-slate-700">
                <h2 class="text-lg font-black uppercase tracking-wide text-slate-200">Herramientas VAR</h2>
            </div>
            
            <div class="p-4 flex flex-col gap-5 overflow-y-auto">
                <div>
                    <label class="text-xs text-slate-400 uppercase font-bold mb-2 block">Trazado de Líneas</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button class="tool-btn active flex flex-col items-center p-3 rounded-lg border-2 border-red-500 bg-red-900/20 text-white transition-all shadow-inner" data-tool="line-red">
                            <div class="w-full h-1 bg-red-500 mb-2 rounded"></div>
                            <span class="text-xs font-bold text-center">Línea Gol<br>(Roja)</span>
                        </button>
                        <button class="tool-btn flex flex-col items-center p-3 rounded-lg border-2 border-slate-600 hover:border-blue-500 hover:bg-blue-900/20 text-slate-300 transition-all" data-tool="line-blue">
                            <div class="w-full h-1 bg-blue-500 mb-2 rounded"></div>
                            <span class="text-xs font-bold text-center">Offside<br>(Azul)</span>
                        </button>
                        <button class="tool-btn flex flex-col items-center p-3 rounded-lg border-2 border-slate-600 hover:border-yellow-400 hover:bg-yellow-900/20 text-slate-300 transition-all" data-tool="arrow-yellow">
                            <svg class="w-6 h-6 text-yellow-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            <span class="text-xs font-bold text-center">Flecha<br>Indicador</span>
                        </button>
                        <button class="tool-btn flex flex-col items-center p-3 rounded-lg border-2 border-slate-600 hover:border-green-400 hover:bg-green-900/20 text-slate-300 transition-all" data-tool="free-green">
                            <svg class="w-6 h-6 text-green-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            <span class="text-xs font-bold text-center">Lápiz<br>Libre</span>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="text-xs text-slate-400 uppercase font-bold mb-2 block">Acciones</label>
                    <div class="flex flex-col gap-2">
                        <button id="btnExport" class="w-full bg-blue-600 hover:bg-blue-500 p-3 rounded-lg text-sm font-bold text-white flex items-center justify-center gap-2 transition-colors shadow-lg disabled:opacity-50" disabled="">
                            Exportar Captura VAR
                        </button>
                        <div class="flex gap-2">
                            <button id="btnUndo" class="flex-1 bg-slate-700 hover:bg-slate-600 p-2 rounded-lg text-sm font-bold transition-colors">Deshacer</button>
                            <button id="btnClear" class="flex-1 bg-red-900/50 hover:bg-red-600 border border-red-800 p-2 rounded-lg text-sm font-bold transition-colors">Limpiar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const video = document.getElementById('sourceVideo');
        const canvas = document.getElementById('varCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const videoUpload = document.getElementById('videoUpload');
        const uploadOverlay = document.getElementById('uploadOverlay');
        const videoContainer = document.getElementById('videoContainer');
        const flashOverlay = document.getElementById('flashOverlay');
        
        const btnPlayPause = document.getElementById('btnPlayPause');
        const iconPlay = document.getElementById('iconPlay');
        const iconPause = document.getElementById('iconPause');
        const btnFrameFwd = document.getElementById('btnFrameFwd');
        const btnFrameBack = document.getElementById('btnFrameBack');
        const videoProgress = document.getElementById('videoProgress');
        const timeCurrent = document.getElementById('timeCurrent');
        const timeTotal = document.getElementById('timeTotal');
        const btnFullscreen = document.getElementById('btnFullscreen');
        const btnExport = document.getElementById('btnExport');

        let isHbrLoaded = false;
        let hbrData = null;
        let currentTick = 0;
        let totalTicks = 0;
        let isPlaying = false;
        let playInterval = null;

        let drawings = [];
        let currentTool = 'line-red';
        let currentThickness = 5;
        let currentOpacity = 0.8;
        let isDrawing = false;
        let startPos = {x: 0, y: 0}, currentMousePos = {x: 0, y: 0}, currentPath = [];
        let animationFrameId = null;

        // Manejo de carga de archivos (.hbr / video)
        videoUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const fileName = file.name.toLowerCase();

            if (fileName.endsWith('.hbr') || fileName.endsWith('.hbr2')) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const arrayBuffer = event.target.result;
                        const uint8Array = new Uint8Array(arrayBuffer);
                        hbrData = msgpack.decode(uint8Array);
                        
                        console.log("Replay HBR decodificado:", hbrData);

                        isHbrLoaded = true;
                        canvas.width = 1280;
                        canvas.height = 720;

                        // Obtener ticks si existen en la estructura del replay
                        totalTicks = hbrData.recording ? hbrData.recording.length : 1000;
                        currentTick = 0;

                        videoProgress.max = totalTicks;
                        videoProgress.value = 0;
                        timeTotal.textContent = formatTicks(totalTicks);

                        uploadOverlay.classList.add('hidden');
                        btnFullscreen.classList.remove('hidden');
                        
                        btnPlayPause.disabled = false;
                        btnFrameFwd.disabled = false;
                        btnFrameBack.disabled = false;
                        videoProgress.disabled = false;
                        btnExport.disabled = false;

                        if (!animationFrameId) drawLoop();
                    } catch (err) {
                        alert("Error al parsear el archivo .hbr: " + err.message);
                    }
                };
                reader.readAsArrayBuffer(file);
                videoUpload.value = '';
                return;
            }

            // Video normal MP4/WebM
            const url = URL.createObjectURL(file);
            video.src = url;
            isHbrLoaded = false;
            uploadOverlay.classList.add('hidden');
            btnFullscreen.classList.remove('hidden');
            btnPlayPause.disabled = false;
            btnFrameFwd.disabled = false;
            btnFrameBack.disabled = false;
            videoProgress.disabled = false;
            btnExport.disabled = false;
        });

        function formatTicks(ticks) {
            const seconds = ticks / 60; // Asumiendo 60 FPS en HaxBall
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}.00`;
        }

        function drawLoop() {
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (isHbrLoaded) {
                // Dibujar la cancha de HaxBall
                drawHaxballPitch();
                
                // Simular/Dibujar elementos del tick actual
                drawReplayObjects(currentTick);
            } else if (video.readyState >= 2) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            }

            drawings.forEach(d => renderShape(d, ctx));

            if (isDrawing) {
                renderShape({
                    tool: currentTool,
                    points: currentPath,
                    startX: startPos.x, startY: startPos.y,
                    endX: currentMousePos.x, endY: currentMousePos.y,
                    thickness: currentThickness, opacity: currentOpacity
                }, ctx);
            }

            animationFrameId = requestAnimationFrame(drawLoop);
        }

        function drawHaxballPitch() {
            // Fondo verde clásico de HaxBall
            ctx.fillStyle = "#71c565";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Líneas de la cancha
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;

            // Línea central
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            // Círculo central
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 100, 0, Math.PI * 2);
            ctx.stroke();

            // Texto indicador de estado
            ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
            ctx.fillRect(canvas.width / 2 - 200, 20, 400, 40);
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 16px Inter, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(`REPLAY .HBR CARGADO - TICK: ${currentTick} / ${totalTicks}`, canvas.width / 2, 45);
        }

        function drawReplayObjects(tick) {
            // Aquí puedes mapear las posiciones de hbrData.recording[tick]
            // Dibujo de ejemplo de la pelota y jugadores en el centro
            ctx.fillStyle = "#ff5555";
            ctx.beginPath();
            ctx.arc(canvas.width / 2 + Math.sin(tick * 0.05) * 150, canvas.height / 2 + Math.cos(tick * 0.03) * 100, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Controles de Reproducción
        btnPlayPause.addEventListener('click', () => {
            if (!isHbrLoaded) return;
            isPlaying = !isPlaying;
            if (isPlaying) {
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
                playInterval = setInterval(() => {
                    if (currentTick < totalTicks) {
                        currentTick++;
                        videoProgress.value = currentTick;
                        timeCurrent.textContent = formatTicks(currentTick);
                    } else {
                        isPlaying = false;
                        clearInterval(playInterval);
                        iconPause.classList.add('hidden');
                        iconPlay.classList.remove('hidden');
                    }
                }, 1000 / 60); // 60 FPS
            } else {
                iconPause.classList.add('hidden');
                iconPlay.classList.remove('hidden');
                clearInterval(playInterval);
            }
        });

        videoProgress.addEventListener('input', (e) => {
            if (!isHbrLoaded) return;
            currentTick = parseInt(e.target.value);
            timeCurrent.textContent = formatTicks(currentTick);
        });

        btnFrameFwd.addEventListener('click', () => {
            if (isHbrLoaded && currentTick < totalTicks) {
                currentTick++;
                videoProgress.value = currentTick;
                timeCurrent.textContent = formatTicks(currentTick);
            }
        });

        btnFrameBack.addEventListener('click', () => {
            if (isHbrLoaded && currentTick > 0) {
                currentTick--;
                videoProgress.value = currentTick;
                timeCurrent.textContent = formatTicks(currentTick);
            }
        });

        // Herramientas de dibujo y exportación
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            startPos = {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
            currentMousePos = {...startPos};
            currentPath = [{...startPos}];
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            currentMousePos = {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
            if (currentTool === 'free-green') currentPath.push({...currentMousePos});
        });

        window.addEventListener('mouseup', () => { isDrawing = false; });

        function renderShape(shape, ctx) {
            ctx.save();
            ctx.globalAlpha = shape.opacity;
            ctx.lineWidth = shape.thickness;
            ctx.strokeStyle = shape.tool.includes('red') ? '#ef4444' : shape.tool.includes('blue') ? '#3b82f6' : '#4ade80';
            ctx.beginPath();
            ctx.moveTo(shape.startX, shape.startY);
            ctx.lineTo(shape.endX, shape.endY);
            ctx.stroke();
            ctx.restore();
        }

        btnUndo.addEventListener('click', () => drawings.pop());
        btnClear.addEventListener('click', () => drawings = []);
    </script>
</body>
</html>
